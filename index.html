<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自転車停止マップ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}.leaflet-marker-icon,.leaflet-marker-shadow{display:block}.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important}.leaflet-container .leaflet-tile{width:auto;padding:0}.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}.leaflet-control{position:relative;z-index:800;pointer-events:auto}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}.leaflet-zoom-animated{transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-popup-pane,.leaflet-control{cursor:auto}.leaflet-dragging .leaflet-grab{cursor:grabbing}.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}.leaflet-container{background:#ddd}.leaflet-container a{color:#0078a8}.leaflet-container{font-family:Helvetica Neue,Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5}.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.65);border-radius:4px}.leaflet-bar a{background-color:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:black}.leaflet-bar a:hover{background-color:#f4f4f4}.leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px}.leaflet-bar a:last-child{border-bottom-left-radius:4px;border-bottom-right-radius:4px;border-bottom:none}.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px monospace}.leaflet-container .leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0}.leaflet-control-attribution{padding:0 5px;color:#333}.leaflet-control-attribution a{text-decoration:none}.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}.leaflet-popup-content{margin:13px 24px;line-height:1.3;font-size:13px}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#333;box-shadow:0 3px 14px rgba(0,0,0,.4)}.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;width:24px;height:24px;font:16px/24px Tahoma,sans-serif;color:#757575;text-decoration:none;background:transparent}.leaflet-div-icon{background:#fff;border:1px solid #666}
:root{--bg:#f7f8fa;--surface:#fff;--fg:#1a1d23;--fg-sub:#6b7280;--border:#e2e5ea;--green:#22c55e;--red:#ef4444;--accent:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Hiragino Sans',system-ui,sans-serif}
#header{position:sticky;top:0;z-index:1000;background:var(--surface);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
#header h1{font-size:15px;font-weight:700;white-space:nowrap}
#session-select{flex:1;max-width:220px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px}
#score-badge{font-size:13px;font-weight:700;white-space:nowrap;color:var(--accent)}
#map{width:100%;height:calc(100vh - 56px)}
#legend{position:fixed;bottom:28px;left:12px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg-sub);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.legend-item{display:flex;align-items:center;gap:7px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="header">
  <h1>🚲 停止マップ</h1>
  <select id="session-select"></select>
  <div id="score-badge">--</div>
</div>
<div id="map"></div>
<div id="legend">
  <div class="legend-item"><div class="dot" style="background:var(--green)"></div>停止あり</div>
  <div class="legend-item"><div class="dot" style="background:var(--red)"></div>停止なし</div>
</div>
<script>
const CSV_URL='near_log.csv';
const DUMMY=`走行ID,時刻(JST),地点ID,緯度,経度,距離(m),速度(km/h),方位角(°),停止判定
1,2026-10-10 09:01:00,1,35.6812,139.7671,2.1,0.0,90,True
1,2026-10-10 09:05:00,2,35.6820,139.7685,4.3,8.2,45,False
1,2026-10-10 09:10:00,3,35.6835,139.7700,1.8,0.0,180,True
2,2026-10-11 08:30:00,1,35.6812,139.7671,1.5,0.0,90,True
2,2026-10-11 08:35:00,2,35.6820,139.7685,5.0,10.1,45,False
2,2026-10-11 08:40:00,3,35.6835,139.7700,2.9,6.5,180,True`;
function parseCSV(t){const l=t.trim().split('\n');const h=l[0].split(',').map(x=>x.trim());return l.slice(1).filter(x=>x.trim()).map(line=>{const v=line.split(',');const o={};h.forEach((k,i)=>o[k]=(v[i]||'').trim());return o});}
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
let markers=[];
function makeIcon(s){const c=s?'#22c55e':'#ef4444';const svg='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34"><path d="M13 0C5.82 0 0 5.82 0 13c0 9.75 13 21 13 21S26 22.75 26 13C26 5.82 20.18 0 13 0z" fill="'+c+'"/><circle cx="13" cy="13" r="6" fill="white"/></svg>';return L.divIcon({html:svg,className:'',iconSize:[26,34],iconAnchor:[13,34],popupAnchor:[0,-34]});}
function showSession(rows,sid){markers.forEach(m=>map.removeLayer(m));markers=[];const f=rows.filter(r=>r['走行ID']===sid);if(!f.length)return;let sc=0;const ll=[];f.forEach(r=>{const lat=parseFloat(r['緯度']),lng=parseFloat(r['経度']);if(isNaN(lat)||isNaN(lng))return;const s=r['停止判定']==='True';if(s)sc++;const m=L.marker([lat,lng],{icon:makeIcon(s)}).bindPopup('<b>地点 '+r['地点ID']+'</b><br>'+r['時刻(JST)']+'<br>距離: '+r['距離(m)']+'m<br><b>'+(s?'✅ 停止':'❌ 未停止')+'</b>');m.addTo(map);markers.push(m);ll.push([lat,lng]);});if(ll.length>1){const line=L.polyline(ll,{color:'#3b82f6',weight:2.5,opacity:0.6,dashArray:'6 4'});line.addTo(map);markers.push(line);}document.getElementById('score-badge').textContent=sc+'/'+f.length+' ('+Math.round(sc/f.length*100)+'%)';map.fitBounds(L.latLngBounds(ll),{padding:[40,40]});}
function init(text){const rows=parseCSV(text);const sessions=[...new Set(rows.map(r=>r['走行ID']))].sort((a,b)=>+a-+b);const sel=document.getElementById('session-select');sel.innerHTML='';sessions.forEach(sid=>{const date=(rows.find(r=>r['走行ID']===sid)||{})['時刻(JST)'];const opt=document.createElement('option');opt.value=sid;opt.textContent='走行 '+sid+'（'+(date?date.slice(0,10):'')+'）';sel.appendChild(opt);});sel.addEventListener('change',()=>showSession(rows,sel.value));if(sessions.length)showSession(rows,sessions[0]);}
fetch(CSV_URL).then(r=>r.ok?r.text():Promise.reject()).then(init).catch(()=>init(DUMMY));
</script>
</body>
</html>
