<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自転車停止マップ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --fg: #1a1d23;
  --fg-sub: #6b7280;
  --border: #e2e5ea;
  --green: #22c55e;
  --red: #ef4444;
  --accent: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: 'Hiragino Sans', system-ui, sans-serif; }
#header {
  position: sticky; top: 0; z-index: 1000;
  background: var(--surface); border-bottom: 1px solid var(--border);
  height: 56px; display: flex; align-items: center;
  gap: 12px; padding: 0 16px;
}
#header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
#session-select {
  flex: 1; max-width: 220px; height: 34px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--fg); font-size: 13px;
}
#score-badge { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--accent); }
#map { width: 100%; height: calc(100vh - 56px); }
#legend {
  position: fixed; bottom: 28px; left: 12px; z-index: 1000;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
  display: flex; flex-direction: column; gap: 6px;
  font-size: 12px; color: var(--fg-sub);
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.legend-item { display: flex; align-items: center; gap: 7px; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.route-line { width: 24px; height: 3px; background: var(--accent); border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="header">
  <h1>停止マップ</h1>
  <select id="session-select"></select>
  <div id="score-badge">--</div>
</div>
<div id="map"></div>
<div id="legend">
  <div class="legend-item"><div class="dot" style="background:var(--green)"></div>停止あり</div>
  <div class="legend-item"><div class="dot" style="background:var(--red)"></div>停止なし</div>
  <div class="legend-item"><div class="route-line"></div>走行ルート</div>
</div>

<script>
const NEAR_CSV = 'near_log.csv?' + Date.now();
const ROUTE_CSV = 'route_log.csv?' + Date.now();

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  });
}

const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

let layers = [];

function makeIcon(stopped) {
  const color = stopped ? '#22c55e' : '#ef4444';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 0C5.82 0 0 5.82 0 13c0 9.75 13 21 13 21S26 22.75 26 13C26 5.82 20.18 0 13 0z" fill="${color}"/>
    <circle cx="13" cy="13" r="6" fill="white"/></svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [26,34], iconAnchor: [13,34], popupAnchor: [0,-34] });
}

function showSession(nearRows, routeRows, sessionId) {
  layers.forEach(l => map.removeLayer(l));
  layers = [];

  // ルートライン
  const routeFiltered = routeRows.filter(r => r['走行ID'] === sessionId);
  const routeLatLngs = routeFiltered
    .map(r => [parseFloat(r['緯度']), parseFloat(r['経度'])])
    .filter(([lat, lng]) => !isNaN(lat) && !isNaN(lng));
  if (routeLatLngs.length > 1) {
    const line = L.polyline(routeLatLngs, {color:'#3b82f6', weight:3, opacity:0.7});
    line.addTo(map);
    layers.push(line);
  }

  // 停止ピン
  const nearFiltered = nearRows.filter(r => r['走行ID'] === sessionId);
  if (!nearFiltered.length) {
    if (routeLatLngs.length) map.fitBounds(L.latLngBounds(routeLatLngs), {padding:[40,40]});
    document.getElementById('score-badge').textContent = '--';
    return;
  }
  let stopCount = 0;
  const allLatLngs = [...routeLatLngs];
  nearFiltered.forEach(r => {
    const lat = parseFloat(r['緯度']), lng = parseFloat(r['経度']);
    if (isNaN(lat) || isNaN(lng)) return;
    const stopped = r['停止判定'] === 'True';
    if (stopped) stopCount++;
    const m = L.marker([lat,lng], {icon: makeIcon(stopped)})
      .bindPopup(`<b>地点 ${r['地点ID']}</b><br>${r['時刻(JST)']}<br>距離: ${r['距離(m)']}m<br><b>${stopped ? '✅ 停止' : '❌ 未停止'}</b>`);
    m.addTo(map); layers.push(m);
    allLatLngs.push([lat, lng]);
  });

  const pct = Math.round(stopCount / nearFiltered.length * 100);
  document.getElementById('score-badge').textContent = `${stopCount}/${nearFiltered.length} (${pct}%)`;
  if (allLatLngs.length) map.fitBounds(L.latLngBounds(allLatLngs), {padding:[40,40]});
}

async function init() {
  let nearText = '', routeText = '';
  try {
    const r = await fetch(NEAR_CSV);
    if (!r.ok) throw new Error();
    nearText = await r.text();
  } catch { nearText = ''; }
  try {
    const r = await fetch(ROUTE_CSV);
    if (!r.ok) throw new Error();
    routeText = await r.text();
  } catch { routeText = ''; }

  const nearRows = nearText ? parseCSV(nearText) : [];
  const routeRows = routeText ? parseCSV(routeText) : [];

  const sessions = [...new Set([
    ...nearRows.map(r => r['走行ID']),
    ...routeRows.map(r => r['走行ID'])
  ])].sort((a,b) => +a - +b);
  const sel = document.getElementById('session-select');
  sel.innerHTML = '';
  sessions.forEach(sid => {
    const row = nearRows.find(r => r['走行ID'] === sid) || routeRows.find(r => r['走行ID'] === sid);
    const dt = row?.['時刻(JST)'] ?? '';
    const date = dt.slice(0,10), time = dt.slice(11,16);
    const opt = document.createElement('option');
    opt.value = sid;
    opt.textContent = `走行 ${sid}（${date} ${time}）`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => showSession(nearRows, routeRows, sel.value));
  if (sessions.length) {
    showSession(nearRows, routeRows, sessions[0]);
  } else {
    map.setView([35.68, 139.69], 13);
  }
}

init();
</script>
</body>
</html>
